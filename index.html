<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberSafe Messenger</title>

<<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
@import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#0f172a;
  --card:#111827cc;
  --glass:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.12);
  --text:#ffffff;
  --muted:#94a3b8;
  --accent:#38bdf8;
  --green:#22c55e;
  --red:#ef4444;
  --shadow:0 15px 50px rgba(0,0,0,.4);
  --radius:26px;
}

html,body{
  width:100%;
  height:100%;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  overflow:hidden;
  background:
    radial-gradient(circle at top left,#1e3a8a 0%,transparent 30%),
    radial-gradient(circle at bottom right,#0f766e 0%,transparent 35%),
    linear-gradient(135deg,#020617,#0f172a,#111827);
  color:var(--text);
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

.app{
  width:100%;
  height:100%;
  max-width:520px;
  max-height:860px;
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  backdrop-filter:blur(18px);
  background:rgba(15,23,42,.35);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  box-shadow:0 25px 55px rgba(0,0,0,.4), 0 0 100px rgba(56,189,248,.08);
  overflow:hidden;
  transition:all 0.3s ease;
}

.screen{
  display:none;
  width:100%;
  height:100%;
  animation:fade .5s ease;
}

.screen.active{
  display:flex;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.home{
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px;
  text-align:center;
  gap:25px;
}

.logo{
  width:120px;
  height:120px;
  border-radius:36px;
  background:linear-gradient(135deg,#38bdf8,#22c55e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:54px;
  box-shadow:
    0 20px 40px rgba(34,197,94,.2),
    0 10px 25px rgba(56,189,248,.25);
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-10px);
  }
}

.title{
  font-size:32px;
  font-weight:800;
  line-height:1.1;
  background:linear-gradient(135deg,#ffffff,#94a3b8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  font-size:15px;
  color:var(--muted);
  line-height:1.6;
  max-width:380px;
}

.language-box{
  display:flex;
  gap:14px;
  margin-top:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.lang-btn,
.main-btn,
.option-btn,
.next-btn{
  border:none;
  cursor:pointer;
  transition:.25s cubic-bezier(0.4, 0, 0.2, 1);
  font-weight:700;
}

.lang-btn{
  padding:12px 20px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  color:white;
  font-size:15px;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);
}

.lang-btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.2);
}

.lang-btn:active{
  transform:translateY(0);
}

.main-btn{
  padding:16px 32px;
  border-radius:18px;
  font-size:18px;
  background:linear-gradient(135deg,#06b6d4,#10b981);
  color:white;
  box-shadow:0 10px 25px rgba(6,182,212,.25);
}

.main-btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 15px 30px rgba(6,182,212,.35);
}

.main-btn:active{
  transform:translateY(0) scale(1);
}

.chat-screen{
  flex-direction:column;
  height:100%;
}

.topbar{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(14px);
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.app-name{
  font-weight:800;
  font-size:18px;
}

.score{
  font-size:14px;
  color:#d1fae5;
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.25);
  padding:6px 14px;
  border-radius:999px;
  font-weight:600;
}

/* Specific styling to replace topbar restart emoji with icon */
.top-row button[onclick="restartGame()"] {
  font-size: 0 !important;
  width: 32px !important;
  height: 32px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  position: relative !important;
  background: rgba(255, 255, 255, 0.08) !important;
  border-radius: 50% !important;
  padding: 0 !important;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

.top-row button[onclick="restartGame()"]:hover {
  background: rgba(255, 255, 255, 0.16) !important;
  transform: rotate(45deg) !important;
}

.top-row button[onclick="restartGame()"]::before {
  content: '\f2f9' !important; /* fa-rotate-right */
  font-family: 'Font Awesome 6 Free' !important;
  font-weight: 900 !important;
  font-size: 14px !important;
  color: var(--muted) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  transition: color 0.2s ease !important;
}

.top-row button[onclick="restartGame()"]:hover::before {
  color: #ffffff !important;
}

.progress-wrap{
  width:100%;
  height:8px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#06b6d4,#10b981);
  border-radius:999px;
  transition:.4s ease-out;
}

.stage{
  font-size:13px;
  color:var(--muted);
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:24px 18px;
  display:flex;
  flex-direction:column;
  gap:20px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:6px;
}

.chat::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.15);
  border-radius:999px;
}

.message{
  display:flex;
  flex-direction:row;
  align-items:flex-start;
  gap:12px;
  animation:msg .35s cubic-bezier(0.4, 0, 0.2, 1);
  max-width:85%;
  width:100%;
}

@keyframes msg{
  from{
    opacity:0;
    transform:translateY(10px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.avatar{
  width:46px;
  height:46px;
  border-radius:12px;
  object-fit:cover;
  background:#1e293b;
  border:1.5px solid rgba(255,255,255,.15);
  flex-shrink:0;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.bubble{
  flex:1;
  padding:14px 18px;
  border-radius:20px;
  border-top-left-radius:4px;
  line-height:1.55;
  font-size:15px;
  box-shadow:var(--shadow);
  word-wrap:break-word;
}

.teacher{
  background:linear-gradient(135deg,#0ea5e9,#2563eb);
}

.hacker{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
}

.robot{
  background:linear-gradient(135deg,#10b981,#059669);
}

/* Static, non-overlapping bottom options panel */
.options{
  position:relative;
  padding:16px 20px 24px;
  display:flex;
  flex-direction:column;
  gap:12px;
  background:rgba(15,23,42,.65);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
}

#answers{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:100%;
}

.option-btn{
  padding:14px 18px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.95);
  font-size:15px;
  border:1px solid rgba(255,255,255,.08);
  text-align:left;
  width:100%;
  box-shadow:0 4px 10px rgba(0, 0, 0, 0.15);
  backdrop-filter:blur(4px);
}

.option-btn:hover:not(:disabled){
  transform:translateY(-2px);
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.2);
  box-shadow:0 6px 15px rgba(0, 0, 0, 0.2);
}

.option-btn:active:not(:disabled){
  transform:translateY(0);
}

.option-btn.correct{
  background:rgba(34,197,94,.22) !important;
  border:1px solid rgba(34,197,94,.55) !important;
  color:#4ade80 !important;
}

.option-btn.wrong{
  background:rgba(239,68,68,.22) !important;
  border:1px solid rgba(239,68,68,.55) !important;
  color:#f87171 !important;
}

.option-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.option-btn.correct:disabled,
.option-btn.wrong:disabled{
  opacity:1;
}

.next-btn{
  padding:14px 20px;
  border-radius:14px;
  background:linear-gradient(135deg,#06b6d4,#10b981);
  color:white;
  font-size:16px;
  font-weight:700;
  box-shadow:0 6px 20px rgba(6,182,212,.3);
  text-align:center;
  width:100%;
}

.next-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(6,182,212,.4);
  filter:brightness(1.05);
}

.next-btn:active{
  transform:translateY(0);
}

.final{
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px;
  text-align:center;
  gap:18px;
}

.trophy{
  font-size:80px;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.06);
  }
}

.final h1{
  font-size:36px;
  font-weight:800;
}

.result-card{
  width:100%;
  padding:24px;
  border-radius:24px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  display:flex;
  flex-direction:column;
  gap:16px;
  box-shadow:var(--shadow);
}

.result-item{
  display:flex;
  justify-content:space-between;
  font-size:16px;
  color:var(--muted);
}

.result-item strong{
  color:white;
}

.level{
  padding:14px;
  border-radius:16px;
  font-size:18px;
  font-weight:800;
  background:linear-gradient(135deg,#06b6d4,#10b981);
  box-shadow:0 8px 20px rgba(6,182,212,.2);
}

.typing{
  display:flex;
  gap:5px;
  padding:14px 18px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.04);
  border-radius:18px;
  width:64px;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:white;
  animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
  animation-delay:.2s;
}

.typing span:nth-child(3){
  animation-delay:.4s;
}

@keyframes typing{
  0%,80%,100%{
    opacity:.3;
    transform:translateY(0);
  }
  40%{
    opacity:1;
    transform:translateY(-4px);
  }
}

@media(max-width:600px){
  .app{
    max-height:100%;
    border-radius:0;
    border:none;
  }
  .title{
    font-size:26px;
  }
  .bubble{
    font-size:14px;
    padding:12px 14px;
  }
  .avatar{
    width:38px;
    height:38px;
    border-radius:10px;
  }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="app">

<!-- HOME -->
<section class="screen home active" id="homeScreen">

<div class="logo">🛡️</div>

<div class="title" id="gameTitle">
CyberSafe Messenger
</div>

<div class="subtitle" id="gameSubtitle">
Ақпараттық қауіпсіздік мәдениетін үйрететін интерактивті чат-ойын
</div>

<div class="language-box">
<button class="lang-btn" onclick="setLanguage('kz')">
Қазақша
</button>

<button class="lang-btn" onclick="setLanguage('ru')">
Русский
</button>
</div>

<button class="main-btn" onclick="startGame()" id="startBtn">
Бастау
</button>

</section>

<!-- GAME -->
<section class="screen chat-screen" id="gameScreen">

<div class="topbar">

<div class="top-row">
<div class="app-name">CyberSafe</div>

<div style="display:flex; align-items:center; gap:10px;">
<div class="score" id="scoreBox">
0 ұпай
</div>
<button onclick="restartGame()" style="background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; padding:4px; display:flex; align-items:center; justify-content:center; transition:0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--muted)'" title="Restart">
🔄
</button>
</div>
</div>

<div class="progress-wrap">
<div class="progress" id="progressBar"></div>
</div>

<div class="stage" id="stageText">
1 / 25
</div>

</div>

<div class="chat" id="chat"></div>

<div class="options">

<div id="answers"></div>

<button class="next-btn" id="nextBtn" onclick="nextQuestion()">
Келесі сұрақ
</button>

</div>

</section>

<!-- FINAL -->
<section class="screen final" id="finalScreen">

<div class="trophy">🏆</div>

<h1 id="finalTitle">Аяқталды!</h1>

<div class="result-card">

<div class="result-item">
<span id="correctLabel">Дұрыс жауаптар</span>
<strong id="correctAnswers">0</strong>
</div>

<div class="result-item">
<span id="percentLabel">Білім пайызы</span>
<strong id="percentResult">0%</strong>
</div>

<div class="level" id="levelBox">
Cyber Hero
</div>

</div>

<button class="main-btn" onclick="restartGame()" id="restartBtn">
Қайта бастау
</button>

</section>

</div>

<script>

/* =========================
AVATARS
========================= */

const teacherAvatar = "images/teacher.jpeg";
const hackerAvatar = "images/hacker.jpeg";
const robotAvatar = "images/robot.jpeg";

/* =========================
CLICK SOUND
========================= */

const clickSound = new Audio(
"data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSAAAAA="
);

/* =========================
LANG
========================= */

let currentLang = "kz";

/* =========================
QUESTIONS
========================= */

const questions = [

{
type:"hacker",
kz:{
message:"Оқушыға «Банктің қауіпсіздік қызметінен» қоңырау шалып, оның картасы бұғатталғанын және телефонға келген СМС-кодты тез арада айтуын сұрады. Оқушы не істеуі керек?",
options:[
"Кодты айту, себебі бұл банк қызметкері",
"Тұтқаны тастап, ата-анасына хабарлау немесе банктің ресми нөміріне қайта қоңырау шалу",
"Кодтың орнына туған жылын айту"
],
correct:1,
explanation:"Банк қызметкерлері ешқашан құпия СМС-кодтарды телефонмен сұрамайды. Бұл — алаяқтар. Кез келген күдікті жағдайда әңгімені тоқтатып, ақпаратты ресми байланыс арналары арқылы тексеру қажет."
},
ru:{
message:"Ученику звонят из «службы безопасности банка» и сообщают, что его карта заблокирована, требуя срочно назвать СМС-код из телефона. Как поступить?",
options:[
"Назвать код, ведь это сотрудник банка.",
"Положить трубку, сообщить родителям или перезвонить по официальному номеру банка.",
"Назвать вместо кода свой год рождения."
],
correct:1,
explanation:"Сотрудники банка никогда не запрашивают секретные СМС-коды по телефону. Это мошенники. При любом подозрении нужно прервать разговор и проверить информацию по официальным контактам."
}
},

{
type:"teacher",
kz:{
message:"Фишинг дегеніміз не?",
options:[
"Желідегі компьютерлік вирустарды жою бағдарламасы",
"Алаяқтардың логин, пароль немесе карта деректерін ұрлау мақсатында жасанды сайттар мен сілтемелерді қолдануы",
"Интернет жылдамдығын арттыратын жаңа желілік технология"
],
correct:1,
explanation:"Фишинг (ағылш. fishing — балық аулау) — бұл қолданушыларды алдап, танымал сайттарға (әлеуметтік желілер, банктер) ұқсас жасанды беттер арқылы олардың құпия мәліметтерін қолды қылу әдісі."
},
ru:{
message:"Что такое фишинг?",
options:[
"Программа для удаления компьютерных вирусов в сети.",
"Использование мошенниками фальшивых сайтов и ссылок для кражи логинов, паролей или данных карт.",
"Новая сетевая технология, увеличивающая скорость интернета."
],
correct:1,
explanation:"Фишинг — это вид интернет-мошенничества, цель которого — выудить у пользователя конфиденциальные данные с помощью поддельных сайтов, визуально копирующих реальные сервисы."
}
},

{
type:"hacker",
kz:{
message:"Әлеуметтік желіде сыныптасыңыздан «Маған шұғыл түрде қарызға ақша берші, картама аударшы» деген хабарлама келді. Сенің әрекетің?",
options:[
"Сыныптасыма көмектесу үшін көрсетілген картаға бірден ақша аудару",
"Сыныптасыма басқа байланыс арнасы арқылы (қоңырау шалу, бетпе-бет кездесу) хабарласып, жағдайды анықтау",
"Хабарламаны елемей, сыныптасыңды бірден бұғаттау"
],
correct:1,
explanation:"Егер жақын адам немесе дос желіде кенеттен ақша сұраса, оның парақшасын алаяқтар бұзып кіруі әбден мүмкін. Ақша аудармас бұрын оған міндетті түрде қоңырау шалып, мәселені нақтылау керек."
},
ru:{
message:"В соцсети пришло сообщение от одноклассника: «Срочно одолжи денег, переведи на карту». Твои действия?",
options:[
"Сразу перевести деньги на указанную карту, чтобы помочь однокласснику.",
"Связаться с одноклассником по другому каналу (позвонить, встретить лично) и уточнить ситуацию.",
"Проигнорировать сообщение и сразу заблокировать одноклассника."
],
correct:1,
explanation:"Если знакомый просит деньги в сети, высока вероятность, что его аккаунт взломали. Перед совершением любых финансовых действий нужно подтвердить личность человека альтернативным способом (например, обычным звонком)."
}
},

{
type:"teacher",
kz:{
message:"Әлеуметтік желілерде қандай ақпаратты ашық жариялауға болмайды?",

/* =========================
STATE
========================= */

let currentQuestion = 0;
let score = 0;

/* =========================
ELEMENTS
========================= */

const homeScreen = document.getElementById("homeScreen");
const gameScreen = document.getElementById("gameScreen");
const finalScreen = document.getElementById("finalScreen");

const chat = document.getElementById("chat");
const answers = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");
const progressBar = document.getElementById("progressBar");
const scoreBox = document.getElementById("scoreBox");
const stageText = document.getElementById("stageText");

/* =========================
LANG SWITCH
========================= */

function setLanguage(lang){

clickSound.play();

currentLang = lang;

document.getElementById("startBtn").innerText =
lang === "kz"
? "Бастау"
: "Начать игру";

document.getElementById("restartBtn").innerText =
lang === "kz"
? "Қайта бастау"
: "Начать заново";

document.getElementById("gameSubtitle").innerText =
lang === "kz"
? "Ақпараттық қауіпсіздік мәдениетін үйрететін интерактивті чат-ойын"
: "Интерактивная чат-игра по информационной безопасности";

document.getElementById("nextBtn").innerText =
lang === "kz"
? "Келесі сұрақ"
: "Следующий вопрос";

document.getElementById("correctLabel").innerText =
lang === "kz"
? "Дұрыс жауаптар"
: "Правильные ответы";

document.getElementById("percentLabel").innerText =
lang === "kz"
? "Білім пайызы"
: "Процент знаний";

document.getElementById("finalTitle").innerText =
lang === "kz"
? "Аяқталды!"
: "Игра окончена!";

}

/* =========================
START GAME
========================= */

function startGame(){

clickSound.play();

homeScreen.classList.remove("active");
gameScreen.classList.add("active");

renderQuestion();

}

/* =========================
RENDER QUESTION
========================= */

async function renderQuestion(){

chat.innerHTML = "";
answers.innerHTML = "";
nextBtn.style.display = "none";

const q = questions[currentQuestion][currentLang];

updateTop();

showTyping();

setTimeout(()=>{

chat.innerHTML = "";

addMessage(
questions[currentQuestion].type === "teacher"
? teacherAvatar
: hackerAvatar,

questions[currentQuestion].type,

q.message
);

q.options.forEach((option,index)=>{

const btn = document.createElement("button");

btn.className = "option-btn";
btn.innerText = option;

btn.onclick = ()=>checkAnswer(index,btn);

answers.appendChild(btn);

});

},1000);

}

/* =========================
MESSAGE
========================= */

function addMessage(avatar,type,text){

const wrapper = document.createElement("div");
wrapper.className = "message";

const img = document.createElement("img");
img.className = "avatar";
img.src = avatar;

const bubble = document.createElement("div");
bubble.className = `bubble ${type}`;

typeText(bubble,text);

wrapper.appendChild(img);
wrapper.appendChild(bubble);

chat.appendChild(wrapper);
chat.scrollTop = chat.scrollHeight;

}

/* =========================
TYPE EFFECT
========================= */

function typeText(el,text){

let i = 0;

const interval = setInterval(()=>{

el.innerHTML += text.charAt(i);

i++;

if(i >= text.length){
clearInterval(interval);
}

},18);

}

/* =========================
TYPING
========================= */

function showTyping(){

chat.innerHTML = `
<div class="message">
<img class="avatar" src="${robotAvatar}">
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
</div>
`;

}

/* =========================
CHECK
========================= */

function checkAnswer(index,btn){

clickSound.play();

const q = questions[currentQuestion][currentLang];
const buttons = document.querySelectorAll(".option-btn");

buttons.forEach((b,i)=>{

b.disabled = true;

if(i === q.correct){
b.classList.add("correct");
}

if(i === index && i !== q.correct){
b.classList.add("wrong");
}

});

if(index === q.correct){
score++;
}

setTimeout(()=>{

addMessage(
robotAvatar,
"robot",
q.explanation
);

nextBtn.style.display = "block";

},700);

updateTop();

}

/* =========================
NEXT
========================= */

function nextQuestion(){

clickSound.play();

currentQuestion++;

if(currentQuestion >= questions.length){
finishGame();
return;
}

renderQuestion();

}

/* =========================
UPDATE TOP
========================= */

function updateTop(){

progressBar.style.width =
((currentQuestion)/questions.length)*100 + "%";

scoreBox.innerText =
currentLang === "kz"
? `${score} ұпай`
: `${score} очков`;

stageText.innerText =
currentLang === "kz"
? `Кезең ${currentQuestion+1} / ${questions.length}`
: `Этап ${currentQuestion+1} / ${questions.length}`;

}

/* =========================
FINISH
========================= */

function finishGame(){

gameScreen.classList.remove("active");
finalScreen.classList.add("active");

const percent =
Math.round((score/questions.length)*100);

document.getElementById("correctAnswers").innerText =
`${score} / ${questions.length}`;

document.getElementById("percentResult").innerText =
percent + "%";

let level = "";

if(percent < 50){
level = "Beginner";
}
else if(percent < 80){
level = "Safe User";
}
else{
level = "Cyber Hero";
}

document.getElementById("levelBox").innerText = level;

}

/* =========================
RESTART
========================= */

function restartGame(){

clickSound.play();

currentQuestion = 0;
score = 0;

gameScreen.classList.remove("active");
finalScreen.classList.remove("active");
homeScreen.classList.add("active");

}

/* =========================
PARTICLES
========================= */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize(){
canvas.width = innerWidth;
canvas.height = innerHeight;
}

window.addEventListener("resize",resize);

resize();

for(let i=0;i<70;i++){

particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2+1,
dx:(Math.random()-.5)*0.4,
dy:(Math.random()-.5)*0.4
});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

p.x += p.dx;
p.y += p.dy;

if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;

ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="rgba(255,255,255,.35)";
ctx.fill();

});

requestAnimationFrame(animate);

}

animate();

</script>
