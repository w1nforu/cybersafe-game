<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberSafe Messenger</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

:root{
--bg:#0f172a;
--card:#111827cc;
--glass:rgba(255,255,255,0.08);
--border:rgba(255,255,255,0.12);
--text:#ffffff;
--muted:#94a3b8;
--accent:#38bdf8;
--green:#22c55e;
--red:#ef4444;
--shadow:0 10px 40px rgba(0,0,0,.35);
--radius:26px;
}

html,body{
width:100%;
height:100%;
font-family:
Inter,
system-ui,
-apple-system,
Segoe UI,
Roboto,
sans-serif;
overflow:hidden;
background:
radial-gradient(circle at top left,#1e3a8a 0%,transparent 30%),
radial-gradient(circle at bottom right,#0f766e 0%,transparent 35%),
linear-gradient(135deg,#020617,#0f172a,#111827);
color:var(--text);
}

body{
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

canvas{
position:fixed;
inset:0;
z-index:0;
}

.app{
width:100%;
height:100%;
max-width:520px;
position:relative;
z-index:2;
display:flex;
flex-direction:column;
backdrop-filter:blur(18px);
background:rgba(15,23,42,.35);
border:1px solid rgba(255,255,255,.08);
overflow:hidden;
}

.screen{
display:none;
width:100%;
height:100%;
animation:fade .5s ease;
}

.screen.active{
display:flex;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.home{
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
text-align:center;
gap:25px;
}

.logo{
width:130px;
height:130px;
border-radius:40px;
background:
linear-gradient(135deg,#38bdf8,#22c55e);
display:flex;
align-items:center;
justify-content:center;
font-size:58px;
box-shadow:
0 20px 50px rgba(34,197,94,.25),
0 10px 30px rgba(56,189,248,.35);
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-10px);
}
}

.title{
font-size:34px;
font-weight:800;
line-height:1.1;
}

.subtitle{
font-size:15px;
color:var(--muted);
line-height:1.6;
max-width:380px;
}

.language-box{
display:flex;
gap:14px;
margin-top:10px;
flex-wrap:wrap;
justify-content:center;
}

.lang-btn,
.main-btn,
.option-btn,
.next-btn{
border:none;
cursor:pointer;
transition:.25s;
font-weight:700;
}

.lang-btn{
padding:14px 22px;
border-radius:18px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.1);
}

.lang-btn:hover{
transform:translateY(-3px);
background:rgba(255,255,255,.14);
}

.main-btn{
padding:18px 34px;
border-radius:22px;
font-size:18px;
background:linear-gradient(135deg,#38bdf8,#22c55e);
color:white;
box-shadow:0 12px 30px rgba(56,189,248,.25);
}

.main-btn:hover{
transform:scale(1.04);
}

.chat-screen{
flex-direction:column;
height:100%;
}

.topbar{
padding:18px;
display:flex;
flex-direction:column;
gap:12px;
background:rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.06);
backdrop-filter:blur(14px);
}

.top-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.app-name{
font-weight:800;
font-size:18px;
}

.score{
font-size:14px;
color:#d1fae5;
background:rgba(34,197,94,.15);
padding:8px 14px;
border-radius:999px;
}

.progress-wrap{
width:100%;
height:10px;
background:rgba(255,255,255,.08);
border-radius:999px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#22c55e);
border-radius:999px;
transition:.4s;
}

.stage{
font-size:13px;
color:var(--muted);
}

.chat{
flex:1;
overflow-y:auto;
padding:20px 16px 120px;
display:flex;
flex-direction:column;
gap:18px;
scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
width:7px;
}

.chat::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.2);
border-radius:999px;
}

.message{
display:flex;
flex-direction: column;
align-items: flex-start;
gap:8px;
animation:msg .35s ease;
max-width: 85%;
}

@keyframes msg{
from{
opacity:0;
transform:translateY(10px) scale(.98);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.message.right{
flex-direction:row-reverse;
}

.avatar{
width:80px;
height:80px;
border-radius:18px;
object-fit:cover;
background:#1e293b;
border:1px solid rgba(255,255,255,.08);
flex-shrink:0;
}

.bubble{
max-width:100%;
width: 100%;
padding:14px 16px;
border-radius:24px;
line-height:1.55;
font-size:15px;
box-shadow:var(--shadow);
word-wrap:break-word;
}

.teacher{
background:linear-gradient(135deg,#0ea5e9,#2563eb);
border-bottom-left-radius:8px;
}

.hacker{
background:linear-gradient(135deg,#ef4444,#b91c1c);
border-bottom-left-radius:8px;
}

.robot{
background:linear-gradient(135deg,#10b981,#059669);
border-bottom-right-radius:8px;
}

.options{
position:absolute;
bottom:0;
left:0;
right:0;
padding:16px;
display:flex;
flex-direction:column;
gap:12px;
background:
linear-gradient(to top,#0f172a 65%,transparent);
backdrop-filter:blur(12px);
}

.option-btn{
padding:16px;
border-radius:18px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
border:1px solid rgba(255,255,255,.08);
text-align:left;
}

.option-btn:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.14);
}

.option-btn.correct{
background:rgba(34,197,94,.22);
border:1px solid rgba(34,197,94,.55);
}

.option-btn.wrong{
background:rgba(239,68,68,.22);
border:1px solid rgba(239,68,68,.55);
}

.option-btn:disabled{
opacity:.85;
cursor:not-allowed;
}

.next-btn{
padding:16px;
border-radius:18px;
background:linear-gradient(135deg,#38bdf8,#22c55e);
color:white;
font-size:16px;
display:none;
}

.final{
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
text-align:center;
gap:18px;
}

.trophy{
font-size:88px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.08);
}
}

.final h1{
font-size:38px;
}

.result-card{
width:100%;
padding:24px;
border-radius:30px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(18px);
display:flex;
flex-direction:column;
gap:16px;
box-shadow:var(--shadow);
}

.result-item{
display:flex;
justify-content:space-between;
font-size:17px;
}

.level{
padding:14px;
border-radius:18px;
font-size:20px;
font-weight:800;
background:linear-gradient(135deg,#38bdf8,#22c55e);
}

.typing{
display:flex;
gap:5px;
padding:16px 20px;
background:rgba(255,255,255,.08);
border-radius:20px;
width:70px;
}

.typing span{
width:8px;
height:8px;
border-radius:50%;
background:white;
animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
animation-delay:.2s;
}

.typing span:nth-child(3){
animation-delay:.4s;
}

@keyframes typing{
0%,80%,100%{
opacity:.3;
transform:translateY(0);
}
40%{
opacity:1;
transform:translateY(-4px);
}
}

@media(max-width:600px){
.title{
font-size:28px;
}
.bubble{
font-size:14px;
}
.avatar{
width:42px;
height:42px;
}
}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="app">

<!-- HOME -->
<section class="screen home active" id="homeScreen">

<div class="logo">🛡️</div>

<div class="title" id="gameTitle">
CyberSafe Messenger
</div>

<div class="subtitle" id="gameSubtitle">
Ақпараттық қауіпсіздік мәдениетін үйрететін интерактивті чат-ойын
</div>

<div class="language-box">
<button class="lang-btn" onclick="setLanguage('kz')">
Қазақша
</button>

<button class="lang-btn" onclick="setLanguage('ru')">
Русский
</button>
</div>

<button class="main-btn" onclick="startGame()" id="startBtn">
Бастау
</button>

</section>

<!-- GAME -->
<section class="screen chat-screen" id="gameScreen">

<div class="topbar">

<div class="top-row">
<div class="app-name">CyberSafe</div>

<div class="score" id="scoreBox">
0 ұпай
</div>
</div>

<div class="progress-wrap">
<div class="progress" id="progressBar"></div>
</div>

<div class="stage" id="stageText">
1 / 25
</div>

</div>

<div class="chat" id="chat"></div>

<div class="options">

<div id="answers"></div>

<button class="next-btn" id="nextBtn" onclick="nextQuestion()">
Келесі сұрақ
</button>

</div>

</section>

<!-- FINAL -->
<section class="screen final" id="finalScreen">

<div class="trophy">🏆</div>

<h1 id="finalTitle">Аяқталды!</h1>

<div class="result-card">

<div class="result-item">
<span id="correctLabel">Дұрыс жауаптар</span>
<strong id="correctAnswers">0</strong>
</div>

<div class="result-item">
<span id="percentLabel">Білім пайызы</span>
<strong id="percentResult">0%</strong>
</div>

<div class="level" id="levelBox">
Cyber Hero
</div>

</div>

<button class="main-btn" onclick="restartGame()" id="restartBtn">
Қайта бастау
</button>

</section>

</div>

<script>

/* =========================
AVATARS
========================= */

const teacherAvatar = "images/teacher.jpeg";
const hackerAvatar = "images/hacker.jpeg";
const robotAvatar = "images/robot.jpeg";

/* =========================
CLICK SOUND
========================= */

const clickSound = new Audio(
"data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSAAAAA="
);

/* =========================
LANG
========================= */

let currentLang = "kz";

/* =========================
QUESTIONS
========================= */

const questions = [

{
type:"teacher",
kz:{
message:"Сенімді пароль деген не?",
options:["123456","qwerty","Арнайы таңбалары бар күрделі пароль"],
correct:2,
explanation:"Сенімді парольде әріптер, сандар және арнайы таңбалар болуы керек."
},
ru:{
message:"Что такое надёжный пароль?",
options:["123456","qwerty","Сложный пароль с символами"],
correct:2,
explanation:"Надёжный пароль должен содержать буквы, цифры и специальные символы."
}
},

{
type:"hacker",
kz:{
message:"Сәлеметсіз бе! Аккаунтты растау үшін SMS кодын айтыңыз.",
options:["Кодты айту","Елемеу","Пароль жіберу"],
correct:1,
explanation:"Растау кодтарын ешкімге айтпа."
},
ru:{
message:"Здравствуйте! Для подтверждения аккаунта скажите код из SMS.",
options:["Сказать код","Игнорировать","Отправить пароль"],
correct:1,
explanation:"Никому не сообщай коды подтверждения."
}
},

{
type:"teacher",
kz:{
message:"Бағдарламаларды жаңарту не үшін маңызды?",
options:["Жаңа вирустар үшін","Осалдықтарды түзету үшін","Файлдарды жою үшін"],
correct:1,
explanation:"Жаңартулар қауіпсіздік мәселелерін жабады."
},
ru:{
message:"Почему важно обновлять программы?",
options:["Для новых вирусов","Для исправления уязвимостей","Чтобы удалить файлы"],
correct:1,
explanation:"Обновления закрывают проблемы безопасности."
}
},

{
type:"hacker",
kz:{
message:"Сіз телефон ұтып алдыңыз! Сілтемеге өтіңіз.",
options:["Сілтемені ашу","Сайтты тексеру","Достарға жіберу"],
correct:1,
explanation:"Күдікті сілтемелерге өтпе."
},
ru:{
message:"Ты выиграл телефон! Перейди по ссылке.",
options:["Открыть ссылку","Проверить сайт","Отправить друзьям"],
correct:1,
explanation:"Не переходи по подозрительным ссылкам."
}
},

{
type:"teacher",
kz:{
message:"Фишинг деген не?",
options:["Спорт түрі","Деректерді ұрлау тәсілі","Антивирус"],
correct:2,
explanation:"Фишинг — жеке мәліметтерді алдау арқылы ұрлау."
},
ru:{
message:"Что такое фишинг?",
options:["Вид спорта","Способ кражи данных","Антивирус"],
correct:2,
explanation:"Фишинг — это обман ради получения личных данных."
}
}

];

/* =========================
AUTO DUPLICATE TO 25
========================= */

while(questions.length < 25){
questions.push(...questions.slice(0,25 - questions.length));
}

questions.length = 25;

/* =========================
STATE
========================= */

let currentQuestion = 0;
let score = 0;

/* =========================
ELEMENTS
========================= */

const homeScreen = document.getElementById("homeScreen");
const gameScreen = document.getElementById("gameScreen");
const finalScreen = document.getElementById("finalScreen");

const chat = document.getElementById("chat");
const answers = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");
const progressBar = document.getElementById("progressBar");
const scoreBox = document.getElementById("scoreBox");
const stageText = document.getElementById("stageText");

/* =========================
LANG SWITCH
========================= */

function setLanguage(lang){

clickSound.play();

currentLang = lang;

document.getElementById("startBtn").innerText =
lang === "kz"
? "Бастау"
: "Начать игру";

document.getElementById("restartBtn").innerText =
lang === "kz"
? "Қайта бастау"
: "Начать заново";

document.getElementById("gameSubtitle").innerText =
lang === "kz"
? "Ақпараттық қауіпсіздік мәдениетін үйрететін интерактивті чат-ойын"
: "Интерактивная чат-игра по информационной безопасности";

}

/* =========================
START GAME
========================= */

function startGame(){

clickSound.play();

homeScreen.classList.remove("active");
gameScreen.classList.add("active");

renderQuestion();

}

/* =========================
RENDER QUESTION
========================= */

async function renderQuestion(){

chat.innerHTML = "";
answers.innerHTML = "";
nextBtn.style.display = "none";

const q = questions[currentQuestion][currentLang];

updateTop();

showTyping();

setTimeout(()=>{

chat.innerHTML = "";

addMessage(
questions[currentQuestion].type === "teacher"
? teacherAvatar
: hackerAvatar,

questions[currentQuestion].type,

q.message
);

q.options.forEach((option,index)=>{

const btn = document.createElement("button");

btn.className = "option-btn";
btn.innerText = option;

btn.onclick = ()=>checkAnswer(index,btn);

answers.appendChild(btn);

});

},1000);

}

/* =========================
MESSAGE
========================= */

function addMessage(avatar,type,text){

const wrapper = document.createElement("div");
wrapper.className = "message";

const img = document.createElement("img");
img.className = "avatar";
img.src = avatar;

const bubble = document.createElement("div");
bubble.className = `bubble ${type}`;

typeText(bubble,text);

wrapper.appendChild(img);
wrapper.appendChild(bubble);

chat.appendChild(wrapper);
chat.scrollTop = chat.scrollHeight;

}

/* =========================
TYPE EFFECT
========================= */

function typeText(el,text){

let i = 0;

const interval = setInterval(()=>{

el.innerHTML += text.charAt(i);

i++;

if(i >= text.length){
clearInterval(interval);
}

},18);

}

/* =========================
TYPING
========================= */

function showTyping(){

chat.innerHTML = `
<div class="message">
<img class="avatar" src="${robotAvatar}">
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
</div>
`;

}

/* =========================
CHECK
========================= */

function checkAnswer(index,btn){

clickSound.play();

const q = questions[currentQuestion][currentLang];
const buttons = document.querySelectorAll(".option-btn");

buttons.forEach((b,i)=>{

b.disabled = true;

if(i === q.correct){
b.classList.add("correct");
}

if(i === index && i !== q.correct){
b.classList.add("wrong");
}

});

if(index === q.correct){
score++;
}

setTimeout(()=>{

addMessage(
robotAvatar,
"robot",
q.explanation
);

nextBtn.style.display = "block";

},700);

updateTop();

}

/* =========================
NEXT
========================= */

function nextQuestion(){

clickSound.play();

currentQuestion++;

if(currentQuestion >= questions.length){
finishGame();
return;
}

renderQuestion();

}

/* =========================
UPDATE TOP
========================= */

function updateTop(){

progressBar.style.width =
((currentQuestion)/questions.length)*100 + "%";

scoreBox.innerText =
currentLang === "kz"
? `${score} ұпай`
: `${score} очков`;

stageText.innerText =
currentLang === "kz"
? `Кезең ${currentQuestion+1} / ${questions.length}`
: `Этап ${currentQuestion+1} / ${questions.length}`;

}

/* =========================
FINISH
========================= */

function finishGame(){

gameScreen.classList.remove("active");
finalScreen.classList.add("active");

const percent =
Math.round((score/questions.length)*100);

document.getElementById("correctAnswers").innerText =
`${score} / ${questions.length}`;

document.getElementById("percentResult").innerText =
percent + "%";

let level = "";

if(percent < 50){
level = "Beginner";
}
else if(percent < 80){
level = "Safe User";
}
else{
level = "Cyber Hero";
}

document.getElementById("levelBox").innerText = level;

}

/* =========================
RESTART
========================= */

function restartGame(){

clickSound.play();

currentQuestion = 0;
score = 0;

finalScreen.classList.remove("active");
homeScreen.classList.add("active");

}

/* =========================
PARTICLES
========================= */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize(){
canvas.width = innerWidth;
canvas.height = innerHeight;
}

window.addEventListener("resize",resize);

resize();

for(let i=0;i<70;i++){

particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2+1,
dx:(Math.random()-.5)*0.4,
dy:(Math.random()-.5)*0.4
});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

p.x += p.dx;
p.y += p.dy;

if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;

ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="rgba(255,255,255,.35)";
ctx.fill();

});

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
